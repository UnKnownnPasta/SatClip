# SatClip shared configuration, read by the API and the workers.
# Override any key with an environment variable: SATCLIP_<SECTION>__<KEY>, e.g. SATCLIP_QUEUE__BACKEND=redis

queue:
  backend: inline          # inline (in-process threads, dev/tests) or redis
  redis_url: redis://localhost:6379/0
  visibility_timeout_s: 300
  worker_concurrency: 4

tiling:
  tile_deg: 0.05           # about 5.5 km at Indian latitudes, about 550 x 550 px at 10 m
  max_tiles_per_job: 400

stac:
  timeout_s: 20
  cooldown_s: 120          # skip a failing catalogue for this long
  search_cell_deg: 1.0     # searches are cached per 1 degree cell, shared by every tile inside it
  page_size: 100
  max_items: 200
  endpoints:               # tried in order (failover); readable=false means search-only (hrefs need credentials)
    - name: earth-search
      url: https://earth-search.aws.element84.com/v1
      s2_collection: sentinel-2-l2a          # public COGs on AWS, no credentials
      s1_collection: sentinel-1-grd          # requester-pays S3, so search-only
      readable: {s1: false, s2: true}
    - name: planetary-computer
      url: https://planetarycomputer.microsoft.com/api/stac/v1
      s2_collection: sentinel-2-l2a
      s1_collection: sentinel-1-rtc          # terrain-corrected backscatter COGs
      signing: planetary-computer            # anonymous SAS token appended to hrefs
      readable: {s1: true, s2: true}
    - name: cdse
      url: https://stac.dataspace.copernicus.eu/v1
      s2_collection: sentinel-2-l2a
      s1_collection: sentinel-1-grd
      readable: {s1: false, s2: false}       # downloads need a free CDSE account; used for metadata and as last resort

scene:
  max_cloud_pct: 20        # per-scene cloud cover above which optical is skipped
  max_tile_cloud_pct: 30   # per-tile cloud share (from SCL) above which the tile abstains
  max_days_from_request: 12
  sar_fallback: true
  monsoon_months: [6, 7, 8, 9]   # SAR is the default sensor for water questions in these months

trust:
  abstain_below: 0.6       # placeholder, refit on a risk-coverage curve in M3/M5
  bands:                   # plain-language confidence bands shown on the card
    - {min: 0.85, label: high}
    - {min: 0.70, label: moderate}
    - {min: 0.0,  label: low}
  calibration_dir: config/calibration

outputs:
  masks_dir: backend/runtime/masks   # per-tile PNG overlays; share this volume between api and workers
  read_res_m: 20                     # measurement resolution (S2 10 m bands are averaged to 20 m)

intents:
  water_extent: sar_water_otsu
  water_change: sar_logratio_change
  vegetation_change: ndvi_difference
  land_cover: zero_shot_landcover
  describe: index_caption
